# Records the last finished week's facts every Monday, using only public GitHub data. No AI, no secrets:
# the workflow's own token reads the projects and commits the result.
name: news-collect

on:
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: news-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # to commit the generated data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 news/tools/snapshot.py
      - name: Publish
        run: |
          git add news/data
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(news): facts up to $(date -u -d yesterday +%F)"
          git pull --rebase origin main
          git push origin main
