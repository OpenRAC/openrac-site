# Weekly updates for the site's packages and the pinned actions. Security fixes come as they are published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node the site runs on (24: Containerfile, CI); move them with Node, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint has to support a new major first; move both together, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
